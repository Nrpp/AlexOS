# Production. One command from the repo root:
#   docker compose -f docker/docker-compose.yml up -d
# Build contexts are the repo root so npm/pip can see the monorepo's
# shared packages and the modules/ directory.
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      # Always derived from ALEXOS_WEB_PORT (below), not from .env's own
      # ALEXOS_CORS_ORIGINS - that key is the *dev server's* origin
      # (Vite's :5173, see .env.example), a different value for a
      # different purpose. Reusing it here used to mean production
      # silently inherited dev's :5173 origin whenever `--env-file .env`
      # was used, blocking every real API call with a CORS error. If you
      # need extra origins too (e.g. reaching AlexOS as
      # http://alexos.local:8090 from other devices, not just
      # http://localhost:8090), edit this line directly, comma-separated.
      ALEXOS_CORS_ORIGINS: http://localhost:${ALEXOS_WEB_PORT:-8090}
      # Forced here, not just left to the Dockerfile's ENV: `env_file`
      # values (../.env, above) override a Dockerfile's ENV for the same
      # key, and .env.example used to ship ALEXOS_DATABASE_URL pointing
      # at a relative, non-persisted path - anyone who copied it into
      # their own .env unedited got a database (module data, including
      # every presence device's token) that silently reset on every
      # `docker compose down`/recreate, since only /srv/api/data (this
      # path) survives that - the rest of the container's filesystem
      # doesn't. Setting it here, last, wins over both the Dockerfile
      # default and a stale/incorrect value from an existing .env, so
      # this self-heals already-affected deployments with no manual
      # .env edit required.
      ALEXOS_DATABASE_URL: sqlite+aiosqlite:////srv/api/data/alexos.db
    # Host networking (Linux only - this is what the Pi runs) so
    # modules/media can discover Cast devices via mDNS/multicast, which
    # doesn't cross Docker's default bridge network. This gives the
    # container full access to the LAN, same as any process running
    # directly on the host - a deliberate tradeoff, not a default to
    # copy elsewhere without thinking about it again. `ports:` is
    # dropped because it's incompatible with network_mode: host - the
    # container binds directly to the host's port 8000.
    network_mode: host
    # NET_RAW is already in Docker's default capability set (enough for
    # most of what's here); NET_ADMIN is not, and modules/presence's
    # Bluetooth-presence polling needs it for l2ping's raw HCI socket
    # (the same `bluez` package modules/control_center already installs -
    # see apps/api/Dockerfile). Narrowly added, not `privileged: true`.
    cap_add:
      - NET_ADMIN
    volumes:
      - alexos_data:/srv/api/data
      # Lets modules/servers list and start/stop/restart Docker
      # containers on the host (see modules/servers/README.md). This is
      # a significant security tradeoff: anything with access to the
      # Docker socket has root-equivalent control over the host - it
      # can start a container with `-v /:/host` and read/write anything.
      # Only acceptable here because this is a single-user personal
      # device, not a shared or internet-facing host. Comment this line
      # out if you'd rather keep Servers' container features disabled.
      - /var/run/docker.sock:/var/run/docker.sock
      # Lets modules/control_center's nmcli/bluetoothctl commands reach
      # the host's NetworkManager/BlueZ over D-Bus to control WiFi and
      # Bluetooth (see modules/control_center/README.md). Another real
      # host-privilege tradeoff, same category as the Docker socket
      # above - the system D-Bus reaches many host services, not just
      # network/bluetooth. Comment out if you'd rather keep the
      # control center's WiFi/Bluetooth features disabled.
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      # Lets modules/tailscale's `tailscale status` reach the host's
      # tailscaled (assumes Tailscale is installed and running on the
      # Pi itself, outside this container). Narrower than the two
      # mounts above - this socket only exposes Tailscale's own status/
      # control, not broad host access. Comment out if you don't run
      # Tailscale on this Pi.
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      # 8090 by default, not 80 - so a fresh install never collides with
      # Pi-hole's admin UI (which listens on 80) if you run both on the
      # same Pi. Override ALEXOS_WEB_PORT in .env to use a different
      # host port (keep ALEXOS_CORS_ORIGINS above in sync if you do -
      # they both have to agree on the browser's actual origin).
      - "${ALEXOS_WEB_PORT:-8090}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  alexos_data:
